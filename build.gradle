plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.deniska777not'

repositories {
    maven { url 'https://cafeteria.dev' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.4"
    mappings "net.fabricmc:yarn:1.21.4+build.2:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.113.0+1.21.4"
    
    // API Баритона
    implementation "io.github.cabaletta:baritone-api:1.21.4-SNAPSHOT"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
